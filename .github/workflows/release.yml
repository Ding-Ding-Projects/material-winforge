name: Build release and publish Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: windows-2025
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
      asset_name: ${{ steps.release.outputs.asset_name }}
      asset_url: ${{ steps.release.outputs.asset_url }}
      asset_sha256: ${{ steps.release.outputs.asset_sha256 }}
      asset_size: ${{ steps.release.outputs.asset_size }}
      published_at: ${{ steps.release.outputs.published_at }}
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      CSC_LINK: ""
      CSC_KEY_PASSWORD: ""
      WIN_CSC_LINK: ""
      WIN_CSC_KEY_PASSWORD: ""
    steps:
      - name: Record workflow start
        id: clock
        shell: pwsh
        run: |
          "started=$([DateTimeOffset]::UtcNow.ToString('o'))" >> $env:GITHUB_OUTPUT

      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bootstrap Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: |
            main-app-design/package-lock.json
            pages/package-lock.json

      - name: Set unique package version
        shell: pwsh
        run: |
          $version = "1.0.${{ github.run_number }}"
          npm --prefix main-app-design version $version --no-git-tag-version
          if ($LASTEXITCODE -ne 0) { throw "Unable to set package version $version." }

      - name: Build runnable application, both site targets, and unsigned Squirrel.Windows artifacts
        shell: pwsh
        run: |
          cmd /c "$env:GITHUB_WORKSPACE\build-installer.bat /s"
          if ($LASTEXITCODE -ne 0) { throw "build-installer.bat failed with exit code $LASTEXITCODE." }

      - name: Stage release evidence
        id: stage
        shell: pwsh
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE 'main-app-design\dist\squirrel-windows'
          $stage = Join-Path $env:GITHUB_WORKSPACE 'release\staging'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          $setup = Get-ChildItem -LiteralPath $source -Filter '*Setup*.exe' -File | Sort-Object Length -Descending | Select-Object -First 1
          $releases = Join-Path $source 'RELEASES'
          $packages = @(Get-ChildItem -LiteralPath $source -Filter '*.nupkg' -File)
          if (-not $setup -or -not (Test-Path -LiteralPath $releases) -or $packages.Count -lt 1) { throw 'Required Squirrel.Windows output is incomplete.' }
          Copy-Item -LiteralPath $setup.FullName,$releases -Destination $stage
          foreach ($package in $packages) { Copy-Item -LiteralPath $package.FullName -Destination $stage }
          $safeFiles = @(Get-ChildItem -LiteralPath $stage -File | Sort-Object Name)
          $sumLines = foreach ($file in $safeFiles) {
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          Set-Content -LiteralPath (Join-Path $stage 'SHA256SUMS.txt') -Value $sumLines -Encoding utf8
          $isSigned = $false
          try {
            $certificate = [Security.Cryptography.X509Certificates.X509Certificate]::CreateFromSignedFile($setup.FullName)
            if ($certificate) { $isSigned = $true }
          } catch [Security.Cryptography.CryptographicException] {
            $isSigned = $false
          }
          if ($isSigned) { throw 'Setup contains an Authenticode certificate; expected an unsigned artifact.' }
          node scripts/count-lines.mjs | Set-Content -LiteralPath (Join-Path $stage 'line-count.md') -Encoding utf8
          node scripts/resolve-dim-sum.mjs --output (Join-Path $stage 'dim-sum.json')
          "setup_name=$($setup.Name)" >> $env:GITHUB_OUTPUT
          "setup_path=$($setup.FullName)" >> $env:GITHUB_OUTPUT
          "setup_size=$($setup.Length)" >> $env:GITHUB_OUTPUT
          "setup_sha=$((Get-FileHash -LiteralPath $setup.FullName -Algorithm SHA256).Hash.ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Publish unique non-draft release
        id: release
        shell: pwsh
        env:
          WORKFLOW_STARTED: ${{ steps.clock.outputs.started }}
          SETUP_NAME: ${{ steps.stage.outputs.setup_name }}
          SETUP_SIZE: ${{ steps.stage.outputs.setup_size }}
          SETUP_SHA: ${{ steps.stage.outputs.setup_sha }}
        run: |
          $stage = Join-Path $env:GITHUB_WORKSPACE 'release\staging'
          $version = "1.0.${{ github.run_number }}"
          $tag = "v$version"
          $beforePublish = [DateTimeOffset]::UtcNow
          $duration = $beforePublish - [DateTimeOffset]::Parse($env:WORKFLOW_STARTED)
          $env:RELEASE_VERSION = $version
          $env:RELEASE_TAG = $tag
          $env:RELEASE_COMMIT = $env:GITHUB_SHA
          $env:WORKFLOW_COMPLETED = $beforePublish.ToString('o')
          $env:WORKFLOW_DURATION = $duration.ToString('hh\:mm\:ss')
          $env:SHA256_FILE = Join-Path $stage 'SHA256SUMS.txt'
          $env:LINE_COUNT_FILE = Join-Path $stage 'line-count.md'
          $env:DIM_SUM_FILE = Join-Path $stage 'dim-sum.json'
          $notes = Join-Path $stage 'release-notes.md'
          node scripts/create-release-notes.mjs $notes
          if ($LASTEXITCODE -ne 0) { throw 'Release-note generation failed.' }
          $assets = @(Get-ChildItem -LiteralPath $stage -File | Where-Object { $_.Name -notin @('line-count.md','dim-sum.json','release-notes.md') } | Select-Object -ExpandProperty FullName)
          gh release create $tag @assets --target $env:GITHUB_SHA --title "WinForge · Material 3 Preview $version" --notes-file $notes --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
          $completed = [DateTimeOffset]::UtcNow
          $env:WORKFLOW_COMPLETED = $completed.ToString('o')
          $env:WORKFLOW_DURATION = ($completed - [DateTimeOffset]::Parse($env:WORKFLOW_STARTED)).ToString('hh\:mm\:ss')
          node scripts/create-release-notes.mjs $notes
          gh release edit $tag --notes-file $notes
          if ($LASTEXITCODE -ne 0) { throw 'Release timing update failed.' }
          $view = gh release view $tag --json assets,publishedAt,tagName,url,targetCommitish | ConvertFrom-Json
          if ($view.tagName -ne $tag -or $view.targetCommitish -ne $env:GITHUB_SHA) { throw 'Published release does not target the intended commit.' }
          $setupAsset = $view.assets | Where-Object { $_.name -eq $env:SETUP_NAME } | Select-Object -First 1
          if (-not $setupAsset -or [long]$setupAsset.size -le 0 -or -not $setupAsset.url) { throw 'Published Setup asset is missing or empty.' }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "commit=$env:GITHUB_SHA" >> $env:GITHUB_OUTPUT
          "asset_name=$($setupAsset.name)" >> $env:GITHUB_OUTPUT
          "asset_url=$($setupAsset.url)" >> $env:GITHUB_OUTPUT
          "asset_sha256=$env:SETUP_SHA" >> $env:GITHUB_OUTPUT
          "asset_size=$($setupAsset.size)" >> $env:GITHUB_OUTPUT
          "published_at=$($view.publishedAt)" >> $env:GITHUB_OUTPUT

      - name: Preserve safe build output
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: material-winforge-build-${{ github.run_id }}
          path: |
            main-app-design/dist/squirrel-windows/*.exe
            main-app-design/dist/squirrel-windows/RELEASES
            main-app-design/dist/squirrel-windows/*.nupkg
            release/staging/SHA256SUMS.txt
          if-no-files-found: warn
          retention-days: 7

  deploy-pages:
    needs: build-release
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Bootstrap Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: pages/package-lock.json

      - name: Install pinned site dependencies
        run: npm --prefix pages ci --no-audit --no-fund

      - name: Write verified installer manifest
        env:
          RELEASE_VERSION: ${{ needs.build-release.outputs.version }}
          RELEASE_TAG: ${{ needs.build-release.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.build-release.outputs.commit }}
          RELEASE_ASSET_NAME: ${{ needs.build-release.outputs.asset_name }}
          RELEASE_ASSET_URL: ${{ needs.build-release.outputs.asset_url }}
          RELEASE_SHA256: ${{ needs.build-release.outputs.asset_sha256 }}
          RELEASE_SIZE: ${{ needs.build-release.outputs.asset_size }}
          RELEASE_PUBLISHED_AT: ${{ needs.build-release.outputs.published_at }}
        run: node scripts/write-release-manifest.mjs pages/public/release-manifest.json

      - name: Build static Pages output
        run: npm --prefix pages run build:pages

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages/dist/client

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Preserve safe Pages output
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: material-winforge-pages-${{ github.run_id }}
          path: pages/dist/client
          if-no-files-found: warn
          retention-days: 7
